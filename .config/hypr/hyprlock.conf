# sample hyprlock.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# you can get started by copying this config to ~/.config/hypr/hyprlock.conf
#

$font = Figtree

general {
    hide_cursor = true
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /home/sage/.config/hypr/wall.jpg
    blur_passes = 4
    brightness = 0.6
}

input-field {
    monitor =
    size = 8%, 3%
    outline_thickness = 0
    inner_color = rgba(0, 0, 0, 0.0) # no fill

# outer ring: light -> mid -> dark, same 45° feel as your active border
outer_color = rgba(0, 0, 0, 0.0)

# check: still reads as “positive” by being brighter overall (light -> mid)
check_color = rgba(0, 0, 0, 0.0) 
# fail: reads as “negative” by being darker overall + a bit of transparency
fail_color = rgba(0, 0, 0, 0.2) 

# text: match your scheme (your current already fits)
font_color = rgba(6a6a6aff) 

    fade_on_empty = false
    rounding = 10

    font_family = $font
    font_size = 20
    placeholder_text = <span font_size="13pt">Password?</span>
    fail_text = <span font_size="13pt">$PAMFAIL</span>

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    dots_size = 0.3
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M %p"
    font_size = 40
    font_family = $font

    position = 60, -60
    halign = left
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 15
    font_family = $font

    position = 60, -40
    halign = left
    valign = top
}

label {
    monitor =
    text = <span font_size="12pt">$LAYOUT[en,ru]</span>
    font_size = 10
    color = rgba(6a6a6aff) 
    onclick = hyprctl switchxkblayout all next

    position = -60, 40
    halign = right
    valign = bottom
}
