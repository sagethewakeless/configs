[main]
font=Roboto:weight=medium:size=11
prompt="  "
placeholder=Search
icon-theme=breeze-dark
terminal=alacritty -e
width=64
lines=10
horizontal-pad=24
vertical-pad=16
inner-pad=12
line-height=21
image-size-ratio=0.5
anchor=center
layer=overlay
show-actions=no
list-executables-in-path=no

[colors]
background=0F0F0FFF
text=E0E0E0FF
prompt=666666FF
placeholder=666666FF
input=E0E0E0FF
match=D45FD4FF
selection=1C1C1CFF
selection-text=E0E0E0FF
selection-match=D45FD4FF
counter=666666FF
border=323232FF

[border]
width=1
radius=12
selection-radius=4

[dmenu]
exit-immediately-if-empty=yes
